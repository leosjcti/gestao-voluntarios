<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo Espaço</title>
    <th:block th:replace="~{fragments :: estilos-globais}"></th:block>
    <style>
        .form-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(139, 94, 52, 0.1); max-width: 600px; margin: 0 auto; }
        .section-title { color: var(--primary-brown); font-size: 15px; font-weight: 700; margin-bottom: 15px; margin-top: 20px; border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; }
        .section-title:first-child { margin-top: 0; }

        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }

        label { margin-bottom: 5px; font-weight: 600; color: var(--text-dark); font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; background: #fcfbf9; box-sizing: border-box; }
        input:focus, textarea:focus { outline: none; border-color: var(--accent-gold); background: white; box-shadow: 0 0 0 3px rgba(217, 163, 74, 0.2); }
        .actions { margin-top: 25px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid #eee; padding-top: 20px;}
    </style>
</head>
<body>
<th:block th:replace="~{fragments :: navbar('agendamentos')}"></th:block>

<div class="container">
    <div class="form-card">
        <h2 class="page-title" style="margin-bottom: 20px; font-size: 20px;">Novo Espaço</h2>

        <form th:action="@{/admin/espacos/novo}" th:object="${espaco}" method="post">
            <div class="section-title">Detalhes do Espaço</div>
            
            <div class="form-group">
                <label>Nome do Espaço:</label>
                <input type="text" th:field="*{nome}" required />
            </div>
            
            <div class="form-group">
                <label>Capacidade (Pessoas):</label>
                <input type="number" th:field="*{capacidade}" />
            </div>
            
            <div class="form-group">
                <label>Descrição:</label>
                <textarea th:field="*{descricao}" rows="3"></textarea>
            </div>

            <div class="actions">
                <a href="/admin/espacos" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Salvar Espaço</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
