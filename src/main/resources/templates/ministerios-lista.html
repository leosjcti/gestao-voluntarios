<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Gerenciar Ministérios</title>
    <th:block th:replace="~{fragments :: estilos-globais}"></th:block>
    <style>
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            max-width: 500px;
        }

        .search-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div th:replace="~{fragments :: navbar(ativo='ministerios')}"></div>

    <div class="container">
        <div class="page-header">
            <h2 class="page-title">Gerenciar Ministérios</h2>
            <div style="display: flex; gap: 10px;">
                <a href="/admin/bases" class="btn btn-secondary"
                    style="background-color: #fff; border: 1px solid #ccc; color: #555;">
                    ⚙️ Gerenciar Bases
                </a>
                <a href="/admin/ministerios/novo" class="btn btn-primary" sec:authorize="hasRole('SUPER_ADMIN')">+ Novo
                    Ministério</a>
            </div>
        </div>

        <form action="/admin/ministerios" method="get" class="search-box">
            <input type="text" name="busca" class="search-input" placeholder="Buscar ministério..." th:value="${busca}">
            <button type="submit" class="btn btn-primary">🔍 Buscar</button>
            <a href="/admin/ministerios" class="btn btn-secondary" th:if="${busca != null}">Limpar</a>
        </form>

        <div th:if="${sucesso}"
            style="background:#dcfce7; color:#166534; padding:10px; border-radius:6px; margin-bottom:15px;">✅ <span
                th:text="${sucesso}"></span></div>
        <div th:if="${erro}"
            style="background:#fee2e2; color:#991b1b; padding:10px; border-radius:6px; margin-bottom:15px;">⚠️ <span
                th:text="${erro}"></span></div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Base</th>
                        <th>Pastor Resp.</th>
                        <th>Liderança</th>
                        <th>Descrição</th>
                        <th style="text-align: right;" sec:authorize="hasRole('SUPER_ADMIN')">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${ministeriosPage.content}">
                        <td th:text="${m.nome}" style="font-weight: 600; color: var(--text-dark);">Nome</td>

                        <td>
                            <span th:if="${m.base != null}" th:text="${m.base.nome}" class="badge"
                                style="background-color: #e0e7ff; color: #3730a3;">BASE</span>
                        </td>

                        <td th:text="${m.pastorResponsavel != null ? m.pastorResponsavel : '-'}" style="color: #555;">
                            Pr. Esio</td>

                        <td>
                            <div th:text="${m.lider != null ? m.lider : '-'}"
                                style="font-weight: 600; font-size: 13px;">Líder</div>
                            <div th:if="${m.contatoLider != null}" th:text="${m.contatoLider}"
                                style="font-size: 12px; color: #666;">📞 Tel</div>
                        </td>

                        <td th:text="${#strings.abbreviate(m.descricao, 30)}" style="color: #888; font-style: italic;">
                            Desc</td>

                        <td style="text-align: right;" sec:authorize="hasRole('SUPER_ADMIN')">
                            <a th:href="@{/admin/ministerios/editar/{id}(id=${m.id})}" class="btn btn-secondary"
                                style="padding: 4px 8px;" title="Editar">✏️</a>
                            <a th:href="@{/admin/ministerios/deletar/{id}(id=${m.id})}" class="btn btn-danger"
                                style="padding: 4px 8px;" onclick="return confirm('Tem certeza?')"
                                title="Excluir">🗑️</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${ministeriosPage.totalPages > 1}">
            <div class="pagination">
                <a th:if="${ministeriosPage.hasPrevious()}"
                    th:href="@{/admin/ministerios(page=${ministeriosPage.number - 1}, busca=${busca})}"
                    class="page-link">←</a>

                <a th:each="i : ${#numbers.sequence(0, ministeriosPage.totalPages - 1)}"
                    th:href="@{/admin/ministerios(page=${i}, busca=${busca})}" th:text="${i + 1}"
                    th:class="${i == ministeriosPage.number} ? 'page-link active' : 'page-link'"></a>

                <a th:if="${ministeriosPage.hasNext()}"
                    th:href="@{/admin/ministerios(page=${ministeriosPage.number + 1}, busca=${busca})}"
                    class="page-link">→</a>
            </div>
            <div class="page-info">
                Página <span th:text="${ministeriosPage.number + 1}"></span> de <span
                    th:text="${ministeriosPage.totalPages}"></span>
            </div>
        </div>
    </div>
</body>

</html>
