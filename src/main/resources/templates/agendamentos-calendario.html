<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Calendário de Agendamentos</title>
    <th:block th:replace="~{fragments :: estilos-globais}"></th:block>
    
    <!-- FullCalendar CSS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
    <!-- FullCalendar JS -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/pt-br.js'></script>

    <style>
        /* FullCalendar Customizations */
        :root {
            --fc-button-bg-color: var(--primary-brown);
            --fc-button-border-color: var(--dark-brown);
            --fc-button-hover-bg-color: var(--dark-brown);
            --fc-button-hover-border-color: #5d3a2a;
            --fc-button-active-bg-color: #5d3a2a;
            --fc-button-active-border-color: #5d3a2a;
            --fc-today-bg-color: rgba(217, 163, 74, 0.15); /* accent-gold with opacity */
        }

        #calendar {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(139, 94, 52, 0.08);
            border: 1px solid #ece7df;
            margin-top: 20px;
        }

        /* Responsive Calendar Header */
        @media (max-width: 768px) {
            .fc .fc-toolbar {
                display: flex;
                flex-direction: column;
                gap: 10px;
                align-items: center;
            }
            .fc .fc-toolbar-title {
                font-size: 1.2em !important;
                text-align: center;
            }
            .fc .fc-toolbar-chunk {
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 5px;
            }
            #calendar {
                padding: 10px;
            }
        }

        .submenu-btn {
            background: #fdfbf7;
            border: 1px solid #d1d5db;
            color: var(--text-dark);
        }
        .submenu-btn:hover {
            background: #e5e7eb;
        }

        /* Modal custom CSS */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center; justify-content: center;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 90%; max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-header {
            font-size: 18px; font-weight: bold; margin-bottom: 15px; color: var(--primary-brown);
        }
        .modal-body {
            margin-bottom: 20px; font-size: 15px;
        }
        .modal-actions {
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end;
        }
    </style>
</head>
<body>
<th:block th:replace="~{fragments :: navbar('agendamentos')}"></th:block>

<div class="container">
    <div th:if="${erro}" style="background-color: var(--danger-bg); color: var(--danger); padding: 15px; border-radius: 6px; margin-bottom: 20px;" th:text="${erro}"></div>
    <div th:if="${mensagem}" style="background-color: var(--success-bg); color: var(--success); padding: 15px; border-radius: 6px; margin-bottom: 20px;" th:text="${mensagem}"></div>

    <div class="page-header">
        <h1 class="page-title">Calendário de Agendamentos</h1>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <a href="/admin/agendamentos/novo" class="btn btn-primary">➕ Novo Evento</a>
            <a href="/admin/agendamentos/conflitos" class="btn submenu-btn">⚠️ Conflitos</a>
            <a href="/admin/espacos" class="btn submenu-btn">🏢 Espaços</a>
            <a href="/admin/agendamentos/exportar.ics" class="btn btn-secondary" target="_blank">📅 Exportar GCal</a>
        </div>
    </div>

    <div id='calendar'></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="eventModal">
    <div class="modal-content">
        <div class="modal-header" id="modalTitle">Detalhes do Evento</div>
        <div class="modal-body" id="modalBody">...</div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
            <form id="formExcluirOcorrencia" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-danger" onclick="return confirm('Tem certeza que deseja excluir APENAS ESTA ocorrência?');">Excluir Ocorrência</button>
            </form>
            <form id="formExcluirEvento" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-danger" style="background:#a93226;" onclick="return confirm('ATENÇÃO: Isto excluirá TODA A SÉRIE do evento. Tem certeza?');">Excluir Série</button>
            </form>
        </div>
    </div>
</div>

<script>
    function fecharModal() {
        document.getElementById('eventModal').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'pt-br',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            events: '/api/agendamentos/ocorrencias',
            height: 'auto',
            eventClick: function(info) {
                var event = info.event;
                var ocorrenciaId = event.id;
                var eventoId = event.extendedProps.eventoId;
                
                document.getElementById('modalTitle').innerText = event.title;
                document.getElementById('modalBody').innerHTML = "<b>Início:</b> " + event.start.toLocaleString('pt-BR') + "<br><b>Fim:</b> " + (event.end ? event.end.toLocaleString('pt-BR') : '');
                
                document.getElementById('formExcluirOcorrencia').action = '/admin/agendamentos/ocorrencia/' + ocorrenciaId + '/excluir';
                
                if (eventoId) {
                    document.getElementById('formExcluirEvento').action = '/admin/agendamentos/evento/' + eventoId + '/excluir';
                    document.getElementById('formExcluirEvento').style.display = 'inline';
                } else {
                    document.getElementById('formExcluirEvento').style.display = 'none';
                }

                document.getElementById('eventModal').style.display = 'flex';
            }
        });
        calendar.render();
    });
</script>

</body>
</html>
