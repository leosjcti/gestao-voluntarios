<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscrição Concluída</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* === PALETA IBAJI === */
        :root {
            --primary-brown: #8b5e34;
            --dark-brown: #744c2c;
            --accent-gold: #d9a34a;
            --text-dark: #4a3f35;
            --success-green: #2e7d32;
        }

        body {
            font-family: 'Inter', sans-serif;
            /* Mesmo fundo gradiente suave do formulário */
            background: linear-gradient(135deg, #fdfbf7, #f3efe9);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
        }

        .card {
            background: #ffffff;
            width: 90%;
            max-width: 500px;
            padding: 3rem 2.5rem;
            border-radius: 18px;
            text-align: center;
            /* Sombra com tom marrom suave, igual ao form */
            box-shadow: 0 10px 30px rgba(139, 94, 52, 0.08);
            border: 1px solid #f0ebe5;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo { margin-bottom: 2rem; }
        .logo img { max-width: 180px; }

        /* Círculo do ícone de sucesso */
        .icon-circle {
            width: 80px;
            height: 80px;
            background-color: #e8f5e9; /* Fundo verde bem clarinho */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
        }

        .checkmark {
            font-size: 40px;
            color: var(--success-green);
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s both;
        }

        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        h1 {
            color: var(--primary-brown);
            font-size: 1.8rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        p {
            font-size: 1.05rem;
            color: #666;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        /* Botão no padrão IBAJI */
        a.button {
            display: inline-block;
            width: 100%;
            padding: 1rem;
            background: var(--primary-brown);
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            border-radius: 12px;
            text-decoration: none;
            transition: background 0.25s, transform 0.1s;
            box-sizing: border-box;
        }

        a.button:hover {
            background: var(--dark-brown);
        }

        a.button:active {
            transform: scale(0.98);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #999;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">
        <img src="/images/ibaji-logo.png" alt="Logo IBAJI">
    </div>

    <div class="icon-circle">
        <div class="checkmark">✔</div>
    </div>

    <h1>Inscrição Realizada!</h1>

    <p th:text="${mensagemSucesso}">
        Recebemos seus dados com sucesso. <br>
        O termo de voluntariado foi enviado para o seu e-mail.
    </p>

    <a href="/cadastro" class="button">Voltar ao Início</a>

</div>

</body>
</html>
